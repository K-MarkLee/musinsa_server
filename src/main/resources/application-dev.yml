#  project-id: fdbdproject

aws:
  s3:
    bucket: ${S3_BUCKET}
    accessKey: ${S3_ACCESS_KEY}
    secretKey: ${S3_SECRET_KEY}

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: ${TOMCAT_THREADS_MAX:200} # 500 증설 효과가 없어 기존 기준값 유지
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100} # backlog 증설 효과는 미검증
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT_MS:20000}
    keep-alive-timeout: ${TOMCAT_KEEP_ALIVE_TIMEOUT_MS:60000}
    max-keep-alive-requests: ${TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}

management:
  server:
    port: 8082
  observations:
    annotations:
      enabled: true
  endpoints:
    web:
      exposure:
        include: prometheus, health, info

  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.01}
    propagation:
      propagate: tracecontext,baggage

  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: true

logging:
  level:
    org:
      elasticsearch.client: ERROR
      hibernate:
        SQL: INFO
        orm.jdbc.bind: INFO
        orm.jdbc.internal.LogicalConnectionImpl: ERROR
      springframework.orm.jpa: ERROR
      springframework.transaction: ERROR
      springframework.web.client.RestTemplate: ERROR
      com.mudosa.musinsa.common.client: ERROR

# 로컬 상품 조회 실행용 공개 기본값. dev 외 환경에서는 JWT_SECRET을 설정한다.
