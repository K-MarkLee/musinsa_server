spring:
  # 검색 측정: 채팅 브로커 자동 설정 제외. 상품 캐시는 사용자 정의 RedisConfig로 유지.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 로컬 상세 조회 비교 기준값. 운영 최적값으로 확정한 수치는 아니다.
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1700000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: ${DB_POOL_LEAK_DETECT_MS:0}

  kafka:
    bootstrap-servers: localhost:9092
  # rabbitmq:
  #   host: ${RABBIT_HOST}
  #   port: 61613
  #   username: guest
  #   password: guest
  #   listener:
  #     simple:
  #       concurrency: 4     # 기본 1
  #       max-concurrency: 16
  #       prefetch: 20


  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

  elasticsearch:
    uris: http://localhost:9200
#    uris: ${OPENSEARCH_SCHEME:http}://${OPENSEARCH_HOST:localhost}:${OPENSEARCH_PORT:9200}
    connection-timeout: 5s
    socket-timeout: 30s
    # username: ${OPENSEARCH_USERNAME}
    # password: ${OPENSEARCH_PASSWORD}

